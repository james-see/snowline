<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>SNOWLINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23081928'/%3E%3Cpath d='M4 22 L16 8 L28 22' fill='none' stroke='%23e8f2ff' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="hud"></div>

      <div id="loader" role="status" aria-live="polite">
        <h1>SNOWLINE</h1>
        <div class="sub">Alpine Arcade</div>
        <div
          id="bar-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-label="Loading"
        >
          <div id="bar-fill"></div>
        </div>
        <div class="loader-meta">
          <div class="status" id="loader-status">Initialising renderer</div>
          <div class="pct" id="loader-pct">0%</div>
        </div>
      </div>

      <div id="error"><pre id="error-text"></pre></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
